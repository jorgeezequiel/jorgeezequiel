name: Generate profile name animation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_name_animation.py"
      - ".github/workflows/generate-name-animation.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-name-animation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "Pillow>=10.4,<13"

      - name: Generate and validate animated GIF
        run: python scripts/generate_name_animation.py

      - name: Commit generated banner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          if git diff --quiet -- assets/jorge-ezequiel-animated.gif; then
            echo "Animated banner is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jorge-ezequiel-animated.gif
          git commit -m "build: generate animated profile name GIF"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" push
