name: Update language statistics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "scripts/update_language_stats.py"
      - "requirements.txt"
      - "assets/language-icons/**"
      - ".github/workflows/update-language-stats.yml"
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: profile-language-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install SVG rendering system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcairo2

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Generate and validate aggregate stats
        env:
          GITHUB_OWNER: jorgeezequiel
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_REPOS_TOKEN: ${{ secrets.PRIVATE_REPOS_TOKEN }}
        run: python scripts/update_language_stats.py

      - name: Commit updated public aggregate artifacts
        run: |
          if git diff --quiet -- README.md assets/language-stats.gif; then
            echo "Statistics are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/language-stats.gif
          git commit -m "chore: update public language statistics"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" push
        env:
          GITHUB_TOKEN: ${{ github.token }}
