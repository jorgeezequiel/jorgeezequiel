<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title desc">
  <title id="title">Jorge Ezequiel</title>
  <desc id="desc">Jorge Ezequiel with a flowing blue, violet, and teal gradient, a soft glow, a gentle floating motion, and an animated underline.</desc>
  <defs>
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#2dd4bf;#38bdf8" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="48%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#2dd4bf;#38bdf8;#a78bfa" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2dd4bf">
        <animate attributeName="stop-color" values="#2dd4bf;#38bdf8;#a78bfa;#2dd4bf" dur="7s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.25 0;0.25 0;-0.25 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="underlineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="190" fill="none"/>

  <text x="450" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="66" font-weight="800" letter-spacing="-1.8" fill="url(#nameGradient)" filter="url(#softGlow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 1;0 0" keyTimes="0;0.35;0.7;1" dur="5s" repeatCount="indefinite"/>
    Jorge Ezequiel
  </text>

  <path d="M 275 128 Q 450 143 625 128" fill="none" stroke="url(#underlineGradient)" stroke-width="3" stroke-linecap="round" stroke-dasharray="350" stroke-dashoffset="350">
    <animate attributeName="stroke-dashoffset" values="350;0;0;350" keyTimes="0;0.28;0.78;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;1;1;0.45" dur="6s" repeatCount="indefinite"/>
  </path>

  <circle cx="270" cy="128" r="2.5" fill="#38bdf8">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;3.5;2" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="630" cy="128" r="2.5" fill="#2dd4bf">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.5;2;3.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>
